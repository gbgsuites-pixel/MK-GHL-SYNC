name: VA-3379 Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run backend contract tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find src -type f -name '*.js' | sort)

      - name: Scan current tree for common credential literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'pit-[0-9a-f-]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude='*.example' .; then
            echo 'Credential-like literal detected in the current tree.'
            exit 1
          fi

      - name: Report dependency audit findings
        continue-on-error: true
        run: npm audit --audit-level=high
